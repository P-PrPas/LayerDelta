name: Reference fixture
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read

jobs:
  windows-desktop-spike:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build Windows desktop spike
        run: ./spikes/desktop/build.ps1
      - name: Stage and smoke-test packaged WebView2 workspace
        run: python spikes/desktop/smoke.py --runtime (Get-Command python).Source

  windows-cpu:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install CPU runtime
        run: python -m pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
      - name: Install test dependencies
        run: python -m pip install -e ".[test,onnx,mcp]"
      - name: Test the adapter, fixture and data contracts
        run: python -m pytest -q
      - name: Run slow large-file tests
        run: python -m pytest -q -m slow
      - name: Build and probe real MNIST
        run: |
          python -m layerdelta.fixture --output .layerdelta/reference --data-dir .layerdelta/mnist
          if ($LASTEXITCODE) {exit $LASTEXITCODE}
          python -m layerdelta.probe --fixture .layerdelta/reference --data-dir .layerdelta/mnist --device cpu
          if ($LASTEXITCODE) {exit $LASTEXITCODE}
          layerdelta-run --fixture .layerdelta/reference --data-dir .layerdelta/mnist --device cpu --cache .layerdelta/cache --output .layerdelta/experiment --target features.block2.conv.kernel --channel 23 --operation zero --hypothesis "Audit the final output channel"
      - name: v1 to v2 recipe equivalence on the real reference checkpoint
        env:
          LAYERDELTA_REQUIRE_FIXTURE: '1'
        run: python -m pytest -q tests/test_edit.py -k real_reference

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build and exercise the Desktop workbench against the CPU service
        shell: pwsh
        run: |
          ./desktop/build.ps1
          if ($LASTEXITCODE) {exit $LASTEXITCODE}
          $env:LAYERDELTA_REQUIRE_DESKTOP_DIST = '1'
          python -m pytest -q tests/test_csp.py -k built_bundle
          if ($LASTEXITCODE) {exit $LASTEXITCODE}
          ./desktop/build/package/LayerDelta/LayerDelta.exe --runtime (Get-Command python).Source --workspace .layerdelta --smoke cpu

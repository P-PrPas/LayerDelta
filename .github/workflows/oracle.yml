name: Dev oracles
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/layerdelta/coupling.py'
      - 'tests/test_depgraph_oracle.py'
      - 'src/layerdelta/evaluators/detection.py'
      - 'tests/test_evaluators.py'
      - '.github/workflows/oracle.yml'
permissions:
  contents: read

# Optional and not required for merge (ADR 0001): compares our coupling groups with Torch-Pruning's on the corpus, and our detection
# mAP with pycocotools' on random cases (v0.5-E3).
jobs:
  oracle:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install CPU runtime
        run: python -m pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
      - name: Install test and oracle extras
        run: python -m pip install -e ".[test,oracle]"
      - name: Run the oracle
        run: python -m pytest -q -m oracle -rs

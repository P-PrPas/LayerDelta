[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "layerdelta"
version = "0.1.0a0"
description = "Local experiments on CNN activations and weights"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch==2.6.0",
    "numpy==2.2.6",
    "safetensors==0.5.3",
]

[project.optional-dependencies]
test = ["pytest==8.4.2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

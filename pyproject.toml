[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "layerdelta"
version = "0.1.0rc1"
license = "Apache-2.0"
license-files = ["LICENSE"]
readme = "README.md"
description = "Local experiments on CNN activations and weights"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch==2.6.0",
    "numpy==2.2.6",
    "safetensors==0.5.3",
    "psutil==7.0.0",
    "fastapi==0.116.1",
    "uvicorn==0.35.0",
    "python-multipart==0.0.20",
    "httpx==0.28.1",
]

[project.scripts]
layerdelta-run = "layerdelta.runner:main"
layerdelta = "layerdelta.server:main"
layerdelta-import = "layerdelta.checkpoints:main"

[project.optional-dependencies]
test = ["pytest==8.4.2"]
oracle = ["torch-pruning==1.6.1"]  # dev-only test oracle for coupling groups (docs/adr/0001-depgraph-oracle.md)

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m \"not slow\""
markers = ["slow: large-file tests, skipped by default (run with -m slow)", "oracle: needs the optional torch-pruning extra (run with -m oracle)"]

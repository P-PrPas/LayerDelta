[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "layerdelta"
version = "0.1.0rc1"
license = "Apache-2.0"
license-files = ["LICENSE"]
readme = "README.md"
description = "Local experiments on CNN activations and weights"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch==2.6.0",
    "numpy==2.2.6",
    "safetensors==0.5.3",
    "psutil==7.0.0",
    "fastapi==0.116.1",
    "uvicorn==0.35.0",
    "python-multipart==0.0.20",
    "httpx==0.28.1",
]

[project.scripts]
layerdelta-run = "layerdelta.runner:main"
layerdelta = "layerdelta.server:main"
layerdelta-import = "layerdelta.checkpoints:main"
layerdelta-mcp = "layerdelta.agent_bridge:main"
layerdelta-agent = "layerdelta.agent_runner:main"

[project.optional-dependencies]
test = ["pytest==8.4.2"]
mcp = ["mcp==1.30.0"]  # optional: the MCP bridge `layerdelta-mcp` (docs/reference/mcp.md)
eval-onnx = ["onnx==1.17.0", "onnxruntime==1.20.1"]  # optional: evaluate an attached ONNX graph (v0.5-E1)
eval = ["Pillow==11.0.0"]  # optional: decode PNG and BMP for evaluations (docs/reference/datasets.md)
onnx = ["onnx==1.17.0"]  # optional: the `onnx` graph provider (docs/reference/graph-ir.md)
oracle = ["torch-pruning==1.6.1", "pycocotools==2.0.11"]  # dev-only test oracles: coupling groups (docs/architecture/adr/0001-depgraph-oracle.md) and detection mAP (v0.5-E3)

[tool.setuptools.package-data]
layerdelta = ["agent_tools.json", "agent_content.json"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m \"not slow\""
markers = ["slow: large-file tests, skipped by default (run with -m slow)", "oracle: needs the optional oracle extra, torch-pruning and pycocotools (run with -m oracle)"]
